  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

slateY(-4px);background:#1a1a20\">\n      <h3 style=\"margin:0;font-size:17px;font-weight:700\">Перевод в любой программе<\u002Fh3>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#a9a7b3;text-wrap:pretty\">Выдели слово и нажми Ctrl+Alt+T — котик покажет перевод.<\u002Fp>\n    <\u002Fdiv>\n    <div data-rv=\"\" style=\"padding:22px;border-radius:18px;background:#141418;display:flex;flex-direction:column;gap:8px;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s\" style-hover=\"transform:translateY(-4px);background:#1a1a20\">\n      <h3 style=\"margin:0;font-size:17px;font-weight:700\">Погода и музыка<\u002Fh3>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#a9a7b3;text-wrap:pretty\">Погода в твоём городе и трек из Spotify прямо в островке.<\u002Fp>\n    <\u002Fdiv>\n    <div data-rv=\"\" style=\"padding:22px;border-radius:18px;background:#141418;display:flex;flex-direction:column;gap:8px;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s\" style-hover=\"transform:translateY(-4px);background:#1a1a20\">\n      <h3 style=\"margin:0;font-size:17px;font-weight:700\">Быстрые кнопки<\u002Fh3>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#a9a7b3;text-wrap:pretty\">Wi-Fi, Bluetooth, ночной свет и «Не беспокоить» в один клик.<\u002Fp>\n    <\u002Fdiv>\n    <div data-rv=\"\" style=\"padding:22px;border-radius:18px;background:#141418;display:flex;flex-direction:column;gap:8px;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s\" style-hover=\"transform:translateY(-4px);background:#1a1a20\">\n      <h3 style=\"margin:0;font-size:17px;font-weight:700\">Под тебя<\u002Fh3>\n      <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#a9a7b3;text-wrap:pretty\">Свои обои, цвет, аватар и любимые программы. 6 языков.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-rv=\"\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <h2 style=\"margin:0;font-size:28px;font-weight:800;letter-spacing:-0.02em\">Как начать<\u002Fh2>\n    <ol style=\"margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px\">\n      <li style=\"display:flex;gap:14px;align-items:baseline;font-size:15.5px;line-height:1.5;color:#c9c7d1\"><b style=\"color:#f2f1f5;flex:none;width:20px\">1<\u002Fb><span>Скачай и запусти <b style=\"color:#f2f1f5\">Nex.exe<\u002Fb>. Если Windows покажет синее окно — нажми «Подробнее» → «Выполнить в любом случае».<\u002Fspan><\u002Fli>\n      <li style=\"display:flex;gap:14px;align-items:baseline;font-size:15.5px;line-height:1.5;color:#c9c7d1\"><b style=\"color:#f2f1f5;flex:none;width:20px\">2<\u002Fb><span>Введи имя и выбери язык.<\u002Fspan><\u002Fli>\n      <li style=\"display:flex;gap:14px;align-items:baseline;font-size:15.5px;line-height:1.5;color:#c9c7d1\"><b style=\"color:#f2f1f5;flex:none;width:20px\">3<\u002Fb><span>Напиши Nex первое сообщение и подключи бесплатный ключ <a href=\"https://console.groq.com/keys\">Groq<\u002Fa> — это займёт минуту.<\u002Fspan><\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n  <div data-rv=\"\" style=\"display:flex;flex-direction:column;gap:20px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap\">\n     <h2 style=\"margin:0;font-size:28px;font-weight:800;letter-spacing:-0.02em\">Отзывы<\u002Fh2>\n     <span style=\"font-size:14px;color:#a9a7b3\">{{ ratingLine }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:18px;background:#141418\">\n     <div style=\"display:flex;align-items:center;gap:6px\">\n      <sc-for list=\"{{ starPick }}\" as=\"s\" hint-placeholder-count=\"5\">\n       <button sc-camel-on-click=\"{{ s.pick }}\" style=\"all:unset;cursor:pointer;font-size:26px;line-height:1;color:{{ s.color }};transition:transform .2s cubic-bezier(.34,1.6,.5,1),color .2s\" style-hover=\"transform:scale(1.2)\">★<\u002Fbutton>\n      <\u002Fsc-for>\n      <span style=\"margin-left:8px;font-size:13.5px;color:#7d7b86\">Твоя оценка<\u002Fspan>\n     <\u002Fdiv>\n     <textarea value=\"{{ revText }}\" sc-camel-on-change=\"{{ onRevText }}\" placeholder=\"Что понравилось? Что улучшить?\" rows=\"3\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:0;outline:none;background:#0f0f13;box-shadow:inset 0 0 0 1px #24242c;color:#f2f1f5;font:inherit;font-size:14.5px;resize:vertical\"><\u002Ftextarea>\n     <button sc-camel-on-click=\"{{ sendReview }}\" style=\"all:unset;cursor:pointer;align-self:flex-start;padding:11px 20px;border-radius:12px;background:#f2f1f5;color:#0b0b0d;font-size:14.5px;font-weight:700;transition:transform .2s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:scale(.97)\">Оставить отзыв<\u002Fbutton>\n    <\u002Fdiv>\n    <sc-if value=\"{{ hasReviews }}\" hint-placeholder-val=\"{{ false }}\">\n     <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px\">\n      <sc-for list=\"{{ reviews }}\" as=\"rv\" hint-placeholder-count=\"2\">\n       <div style=\"padding:18px;border-radius:18px;background:#141418;display:flex;flex-direction:column;gap:10px\">\n        <div style=\"display:flex;align-items:center;gap:10px\">\n         <img src=\"{{ rv.avatar }}\" alt=\"\" style=\"width:32px;height:32px;border-radius:50%;background:#24242c\">\n         <b style=\"font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis\">{{ rv.user }}<\u002Fb>\n         <span style=\"color:#ffc531;font-size:14px;letter-spacing:1px\">{{ rv.stars }}<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.55;color:#c9c7d1;text-wrap:pretty\">{{ rv.text }}<\u002Fp>\n       <\u002Fdiv>\n      <\u002Fsc-for>\n     <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ noReviews }}\" hint-placeholder-val=\"{{ true }}\">\n     <p style=\"margin:0;font-size:14.5px;color:#7d7b86\">Пока отзывов нет — будь первым.<\u002Fp>\n    <\u002Fsc-if>\n   <\u002Fdiv>\n   <p data-rv=\"\" style=\"margin:0;padding-top:24px;border-top:1px solid #1f1f25;font-size:13.5px;line-height:1.6;color:#6f6d78;text-wrap:pretty\">Nex не отправляет твои файлы в интернет — всё хранится на компьютере. Антивирус может предупредить о программе без подписи — это нормально. Nex работает на ИИ и может ошибаться — проверяй важную информацию.<\u002Fp>\n <\u002Fdiv>\n <aside style=\"flex:1 1 340px;max-width:460px;display:flex;flex-direction:column;gap:12px;position:sticky;top:24px\">\n  <h2 style=\"margin:0 0 8px;font-size:28px;font-weight:800;letter-spacing:-0.02em\">Контакты<\u002Fh2>\n   <a href=\"mailto:nexdesktop.help@gmail.com\" target=\"_blank\" rel=\"noopener\" data-rv=\"\" style=\"display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:#141418;color:#f2f1f5;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s\" style-hover=\"transform:translateY(-3px);background:#1a1a20;color:#f2f1f5\">\n    <span style=\"width:48px;height:48px;flex:none;border-radius:14px;background:rgba(139,123,255,.14);color:#b9b0ff;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"3\"><\u002Frect><path d=\"m4 7 8 6 8-6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><b style=\"font-size:16px;font-weight:700\">Почта<\u002Fb><span style=\"font-size:13.5px;color:#a9a7b3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">nexdesktop.help@gmail.com<\u002Fspan><\u002Fspan>\n    <span style=\"font-size:13px;font-weight:700;color:#b9b0ff;flex:none\">Написать<\u002Fspan>\n   <\u002Fa>\n   <a href=\"https://github.com/pencionerMAMA/NexApp/issues\" target=\"_blank\" rel=\"noopener\" data-rv=\"\" style=\"display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:#141418;color:#f2f1f5;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s\" style-hover=\"transform:translateY(-3px);background:#1a1a20;color:#f2f1f5\">\n    <span style=\"width:48px;height:48px;flex:none;border-radius:14px;background:rgba(139,123,255,.14);color:#b9b0ff;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5h16v11H9l-5 4z\"><\u002Fpath><path d=\"M8 10h8M8 13h5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><b style=\"font-size:16px;font-weight:700\">Онлайн-поддержка<\u002Fb><span style=\"font-size:13.5px;color:#a9a7b3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Сообщи об ошибке или задай вопрос<\u002Fspan><\u002Fspan>\n    <span style=\"font-size:13px;font-weight:700;color:#b9b0ff;flex:none\">Открыть<\u002Fspan>\n   <\u002Fa>\n   <a href=\"https://github.com/pencionerMAMA/NexApp\" target=\"_blank\" rel=\"noopener\" data-rv=\"\" style=\"display:flex;align-items:center;gap:16px;padding:18px;border-radius:18px;background:#141418;color:#f2f1f5;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .3s\" style-hover=\"transform:translateY(-3px);background:#1a1a20;color:#f2f1f5\">\n    <span style=\"width:48px;height:48px;flex:none;border-radius:14px;background:rgba(139,123,255,.14);color:#b9b0ff;display:flex;align-items:center;justify-content:center\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n    <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:3px\"><b style=\"font-size:16px;font-weight:700\">Поддержать проект<\u002Fb><span style=\"font-size:13.5px;color:#a9a7b3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">Поставь звезду и расскажи друзьям<\u002Fspan><\u002Fspan>\n    <span style=\"font-size:13px;font-weight:700;color:#b9b0ff;flex:none\">★ Звезда<\u002Fspan>\n   <\u002Fa>\n   <div data-rv=\"\" style=\"margin-top:20px;display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:18px;background:#141418\">\n    <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:40px;height:40px;border-radius:12px;background:rgba(255,107,107,.14);color:#ff8a8a;display:flex;align-items:center;justify-content:center\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"7\" y=\"7\" width=\"10\" height=\"13\" rx=\"5\"><\u002Frect><path d=\"M9 7a3 3 0 0 1 6 0M3 12h4M17 12h4M4 18l3-2M20 18l-3-2M4 6l3 2M20 6l-3 2\"><\u002Fpath><\u002Fsvg><\u002Fspan><b style=\"font-size:17px\">Нашёл ошибку?<\u002Fb><\u002Fdiv>\n    <input value=\"{{ bugTitle }}\" sc-camel-on-change=\"{{ onBugTitle }}\" placeholder=\"Коротко: что сломалось\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:0;outline:none;background:#0f0f13;box-shadow:inset 0 0 0 1px #24242c;color:#f2f1f5;font:inherit;font-size:14.5px\">\n    <textarea value=\"{{ bugText }}\" sc-camel-on-change=\"{{ onBugText }}\" placeholder=\"Что делал, что ожидал, что произошло\" rows=\"4\" style=\"width:100%;box-sizing:border-box;padding:12px 14px;border-radius:12px;border:0;outline:none;background:#0f0f13;box-shadow:inset 0 0 0 1px #24242c;color:#f2f1f5;font:inherit;font-size:14.5px;resize:vertical\"><\u002Ftextarea>\n    <button sc-camel-on-click=\"{{ sendBug }}\" style=\"all:unset;cursor:pointer;text-align:center;padding:12px 20px;border-radius:12px;background:#ff6b6b;color:#0b0b0d;font-size:14.5px;font-weight:800;transition:transform .2s\" style-hover=\"transform:translateY(-2px)\" style-active=\"transform:scale(.97)\">Отправить тикет<\u002Fbutton>\n    <span style=\"font-size:12.5px;color:#7d7b86\">Откроется GitHub — там нажми «Submit».<\u002Fspan>\n   <\u002Fdiv>\n <\u002Faside>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { dl: null, st: null, tab: 0, ui: 0, sw: false, bad: {}, revs: [], myStars: 5, hov: 0, revText: '', bugTitle: '', bugText: '' };\n  boxRef = React.createRef();\n  REPO = 'pencionerMAMA/NexApp';\n  openIssue(title, body) {\n    window.open(`https://github.com/${this.REPO}/issues/new?title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, '_blank', 'noopener');\n  }\n  async loadReviews() {\n    try {\n      const r = await fetch(`https://api.github.com/repos/${this.REPO}/issues?state=all&per_page=100`);\n      if (!r.ok) return;\n      const list = (await r.json()).filter(i => !i.pull_request && /^[1-5]★/.test(i.title || '')).map(i => ({\n        n: +i.title[0], user: i.user.login, avatar: i.user.avatar_url,\n        stars: '★'.repeat(+i.title[0]) + '☆'.repeat(5 - +i.title[0]),\n        text: String(i.body || '').replace(/\\n*---[\\s\\S]*$/, '').trim().slice(0, 400) || 'Без текста'\n      }));\n      this.setState({ revs: list, vt: list.length, rt: list.length ? list.reduce((a, b) => a + b.n, 0) / list.length : null });\n    } catch {}\n  }\n  pick(i) {\n    if (i === this.state.ui) return;\n    this.setState({ ui: i, sw: true });\n    clearTimeout(this.swT);\n    this.swT = setTimeout(() => { this.setState({ tab: i }); requestAnimationFrame(() => this.setState({ sw: false })); }, 320);\n  }\n  renderVals() {\n    const f = n => n == null ? '—' : n.toLocaleString('ru-RU');\n    const V = [\n      { label: 'Установка', src: 'video/nex.mp4#t=0', cap: 'Как скачать Nex, пройти синее окно Windows и подключить бесплатный ключ.' },\n      { label: 'Что внутри', src: 'video/nex.mp4#t=26', cap: 'Погода, музыка, Wi-Fi и Bluetooth, «Не беспокоить», обои и 6 языков.' }\n    ];\n    V[0].page = 'Nex Video.dc.html'; V[0].at = 0;\n    V[1].page = 'Nex Tour.dc.html'; V[1].at = 0;\n    const cur = V[this.state.tab], e = React.createElement;\n    const seek = ev => {\n      const fr = ev.target, at = cur.at;\n      let n = 0;\n      const tryIt = () => {\n        try {\n          const el = fr.contentDocument.querySelector('[data-om-exportable-video-with-duration-secs]');\n          if (el) { el.dispatchEvent(new CustomEvent('data-om-seek-to-time-frame', { detail: { time: at, sync: true, playing: true } })); return; }\n        } catch (x) { return; }\n        if (n++ < 40) setTimeout(tryIt, 150);\n      };\n      tryIt();\n    };\n    const player = cur.page\n      ? e('iframe', { key: cur.page + cur.at, src: cur.page, onLoad: seek, title: cur.label, style: { position: 'absolute', inset: 0, width: '100%', height: '100%', border: 0, background: '#0b0b0d' } })\n      : this.state.bad[cur.src]\n      ? e('div', { style: { position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12, color: '#7d7b86', fontSize: 14 } },\n          e('div', { style: { width: 64, height: 64, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'rgba(139,123,255,.15)', color: '#b9b0ff', fontSize: 22 } }, '▶'),\n          e('span', null, 'Видео «' + cur.label + '» скоро'))\n      : e('video', { key: cur.src, src: cur.src, controls: true, playsInline: true, preload: 'metadata', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', background: '#000' },\n          onError: () => this.setState(s => ({ bad: { ...s.bad, [cur.src]: true } })) });\n    return {\n      tabs: V.map((v, i) => ({ label: v.label, pick: () => this.pick(i), color: i === this.state.ui ? '#0b0b0d' : '#a9a7b3' })),\n      pillX: `translateX(${(this.state.ui || 0) * 100}%)`,\n      vo: this.state.sw ? 0 : 1, vt: this.state.sw ? 'scale(.96) translateY(10px)' : 'none', vf: this.state.sw ? 'blur(8px)' : 'none',\n      boxRef: this.boxRef,\n      starPick: [1, 2, 3, 4, 5].map(n => ({ pick: () => this.setState({ myStars: n }), color: n <= this.state.myStars ? '#ffc531' : '#3a3a44' })),\n      revText: this.state.revText, onRevText: e => this.setState({ revText: e.target.value }),\n      sendReview: () => this.openIssue(`${this.state.myStars}★ Отзыв`, `${this.state.revText || ''}\\n\\n---\\nОтзыв с сайта Nex`),\n      reviews: this.state.revs, hasReviews: this.state.revs.length > 0, noReviews: this.state.revs.length === 0,\n      ratingLine: this.state.revs.length ? `${this.state.rt.toFixed(1).replace('.', ',')} ★ · ${this.state.revs.length} отзывов` : '',\n      bugTitle: this.state.bugTitle, onBugTitle: e => this.setState({ bugTitle: e.target.value }),\n      bugText: this.state.bugText, onBugText: e => this.setState({ bugText: e.target.value }),\n      sendBug: () => this.openIssue(`[Баг] ${this.state.bugTitle || 'Ошибка в Nex'}`, `${this.state.bugText || ''}\\n\\n---\\nВерсия: 1.0.0\\nWindows: ${navigator.userAgent.includes('Windows NT 10') ? '10/11' : '?'}`),\n      full: () => { const b = this.boxRef.current; if (!b) return; const f = b.querySelector('iframe') || b; (f.requestFullscreen || f.webkitRequestFullscreen).call(f); },\n      player, caption: cur.cap, downloads: f(this.state.dl), online: f(this.state.on), rating: this.state.rt == null ? '—' : this.state.rt.toFixed(2).replace('.', ','), votes: f(this.state.vt) };\n  }\n  async loadStats() {\n    const R = 'https://api.github.com/repos/pencionerMAMA/NexApp';\n    try {\n      const [rel, repo] = await Promise.all([fetch(R + '/releases?per_page=100').then(r => r.ok ? r.json() : null), fetch(R).then(r => r.ok ? r.json() : null)]);\n      const dl = Array.isArray(rel) ? rel.reduce((s, x) => s + (x.assets || []).reduce((a, b) => a + (b.download_count || 0), 0), 0) : this.state.dl;\n      this.setState({ dl, st: repo ? repo.stargazers_count : this.state.st });\n    } catch {}\n  }\n  componentDidMount() {\n    this.loadStats();\n    this.loadReviews();\n    this.statT = setInterval(() => this.loadStats(), 120000);\n    const ease = 'cubic-bezier(.2,.8,.2,1)';\n    const els = [...document.querySelectorAll('[data-rv]')];\n    const prev = new Map();\n    els.forEach(el => {\n      const sib = [...el.parentElement.children].filter(c => c.hasAttribute('data-rv'));\n      const d = sib.length > 1 ? (sib.indexOf(el) % 3) * 90 : 0;\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(40px) scale(.97)';\n      el.style.filter = 'blur(6px)';\n      el.style.transition = `opacity .9s ${ease} ${d}ms, transform .9s ${ease} ${d}ms, filter .9s ${ease} ${d}ms, background .3s`;\n    });\n    this.io = new IntersectionObserver(es => es.forEach(e => {\n      if (!e.isIntersecting) return;\n      const el = e.target;\n      el.style.opacity = '1'; el.style.transform = ''; el.style.filter = '';\n      setTimeout(() => { el.style.transition = `transform .3s ${ease}, background .3s`; }, 1300);\n      this.io.unobserve(el);\n    }), { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });\n    els.forEach(el => this.io.observe(el));\n    const hero = document.querySelector('[data-hero]');\n    this.onScroll = () => {\n      if (!hero) return;\n      const p = Math.min(1, window.scrollY / (window.innerHeight * 0.8));\n      hero.style.opacity = String(1 - p * 0.85);\n      hero.style.transform = `translateY(${p * -60}px) scale(${1 - p * 0.06})`;\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n  }\n  componentWillUnmount() { clearInterval(this.statT); this.io && this.io.disconnect(); window.removeEventListener('scroll', this.onScroll); }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
