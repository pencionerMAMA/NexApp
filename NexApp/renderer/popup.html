<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;background:transparent;overflow:hidden;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#f2f1f6;user-select:text}
.card{margin:0;padding:12px 14px 13px;border-radius:16px;background:#0d0d10;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);display:flex;gap:11px;animation:in .3s cubic-bezier(.2,.9,.3,1.2) both}
.av{width:34px;height:34px;border-radius:50%;background:#ece7ff;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;flex:none}
.av img{width:38px}
.body{min-width:0;flex:1}
.src{font-size:12px;color:#8e8b9c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px}
.tr{margin-top:3px;font-size:15px;font-weight:600;line-height:1.35;word-wrap:break-word}
.ex{margin-top:4px;font-size:12.5px;color:#b9b6c6;line-height:1.4}
.x{position:absolute;top:6px;right:10px;width:20px;height:20px;border:none;background:none;color:#77757f;font-size:16px;cursor:pointer;line-height:1}
.x:hover{color:#fff}
.typing{display:flex;gap:4px;margin-top:8px}.typing i{width:6px;height:6px;border-radius:50%;background:#77757f;animation:tp 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25}30%{opacity:1}}
@keyframes in{from{opacity:0;transform:translateY(6px) scale(.96)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="av"><img src="nex/happy.png" alt=""></div>
  <div class="body"><div class="src" id="src"></div><div id="out"><div class="typing"><i></i><i></i><i></i></div></div></div>
</div>
<button class="x" onclick="window.close()">×</button>
<script>
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
window.setSrc = t => { document.getElementById('src').textContent = t; };
window.setOut = (tr, ex, err) => {
  document.getElementById('out').innerHTML = err ? `<div class="ex">${esc(err)}</div>` : `<div class="tr">${esc(tr)}</div>${ex ? `<div class="ex">${esc(ex)}</div>` : ''}`;
  return document.getElementById('card').offsetHeight;
};
addEventListener('keydown', e => { if (e.key === 'Escape') window.close(); });
</script>
</body>
</html>
